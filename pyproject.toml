[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "councilroom"
version = "0.1.0"
description = "One question. Multiple models. One considered answer."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
councilroom = "councilroom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/councilroom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
